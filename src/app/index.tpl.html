<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>HKOI Battlefield Beta</title>
<style>
  :root { --bg: #0b0f0e; --panel: rgba(9, 13, 12, .88); --line: rgba(57, 217, 138, .28); --fg: #e6efe9; --dim: #93a39a; --accent: #39d98a; --warn: #ffb347; --bad: #ff5a4d; --mono: ui-monospace, Menlo, Consolas, monospace; color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, 'Segoe UI', sans-serif; overflow: hidden; }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  button, select, input { font: inherit; color: inherit; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }   /* no backdrop blur: blurring live 3D behind every panel costs a great deal each frame */
  #hud { position: fixed; left: 12px; top: 12px; font: 11px/1.45 var(--mono); padding: 6px 9px; white-space: pre-wrap; pointer-events: none; color: var(--dim); max-width: min(420px, calc(100vw - 24px)); }
  /* status strip */
  #status { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; max-width: calc(100vw - 24px); pointer-events: none; }
  .chip { padding: 5px 10px; font: 12px/1.2 var(--mono); letter-spacing: .04em; white-space: nowrap; }
  .chip b { color: var(--accent); font-weight: 600; } .chip.warn b { color: var(--warn); } .chip.bad b { color: var(--bad); }
  /* caption */
  #caption { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); max-width: min(900px, calc(100vw - 32px)); text-align: center; font-size: clamp(15px, 1.5vw, 20px); font-weight: 500; text-shadow: 0 1px 3px #000, 0 0 12px #000; pointer-events: none; transition: opacity .4s; }
  #caption small { display: block; font-size: .72em; color: var(--dim); font-weight: 400; margin-top: 2px; }
  /* log */
  #log { position: fixed; right: 12px; top: 96px; width: min(360px, calc(100vw - 24px)); max-height: 38vh; overflow: auto; padding: 8px 10px; font: 11.5px/1.45 var(--mono); }
  #log div { margin-bottom: 3px; color: var(--dim); } #log div b { color: var(--fg); font-weight: 500; } #log .k-engine b { color: #cfe9dc; } #log .k-volley b { color: var(--warn); } #log .k-result b { color: var(--accent); } #log .k-enemy b { color: #ff9d8f; }
  /* control bar */
  #bar { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; padding: 8px; max-width: calc(100vw - 24px); }
  #bar .grp { display: flex; gap: 4px; align-items: center; padding: 0 6px; border-right: 1px solid var(--line); } #bar .grp:last-child { border-right: 0; }
  .btn { background: rgba(255, 255, 255, .05); border: 1px solid transparent; border-radius: 6px; padding: 6px 10px; cursor: pointer; font-size: 13px; white-space: nowrap; }
  .btn:hover { background: rgba(255, 255, 255, .12); } .btn.on { border-color: var(--accent); color: var(--accent); background: rgba(57, 217, 138, .1); } .btn.spec { color: #ffb9ae; } .btn.spec.on { border-color: #ff8a7a; color: #ff8a7a; background: rgba(255, 138, 122, .1); }
  .btn.primary { background: var(--accent); color: #05130c; font-weight: 700; padding: 10px 22px; font-size: 15px; } .btn.primary:hover { filter: brightness(1.1); background: var(--accent); }
  /* markers */
  #marks { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .mk { position: absolute; left: 0; top: 0; font: 10.5px/1.2 var(--mono); white-space: nowrap; will-change: transform; }
  .mk i { position: absolute; left: -9px; top: -9px; width: 16px; height: 16px; border: 1.5px solid currentColor; transform: rotate(45deg); box-sizing: border-box; }
  .mk span { position: absolute; left: 14px; top: -9px; background: rgba(0, 0, 0, .62); padding: 2px 5px; border-radius: 3px; font-weight: 600; }
  .mk.threat { color: var(--warn); } .mk.tracked { color: var(--bad); } .mk.site { color: #ff8a7a; } .mk.site i { transform: none; border-radius: 50%; } .mk.ghost { color: rgba(255, 255, 255, .45); } .mk.ghost i { transform: none; border-style: dashed; border-radius: 50%; }
  /* title / setup / result */
  .screen { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: radial-gradient(ellipse at center, rgba(4, 8, 7, .35), rgba(4, 8, 7, .82)); padding: 16px; overflow: auto; }
  .card { width: min(760px, 100%); padding: 26px 28px; }
  .card h1 { margin: 0; font-size: clamp(26px, 4vw, 40px); letter-spacing: .08em; font-weight: 800; } .card h1 em { font-style: normal; color: var(--accent); }
  .card .sub { color: var(--dim); margin: 4px 0 18px; }
  .opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px 18px; }
  .opt label { display: block; font: 11px/1 var(--mono); color: var(--dim); letter-spacing: .1em; text-transform: uppercase; margin-bottom: 6px; }
  .seg { display: flex; flex-wrap: wrap; gap: 4px; }
  .row { display: flex; gap: 10px; align-items: center; margin-top: 20px; flex-wrap: wrap; }
  .row .note { color: var(--dim); font-size: 12px; flex: 1; min-width: 200px; }
  input[type=number] { width: 84px; background: rgba(255, 255, 255, .06); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
  #result table { border-collapse: collapse; width: 100%; margin: 12px 0; font: 13px/1.5 var(--mono); } #result td { padding: 2px 8px 2px 0; } #result td:last-child { text-align: right; color: var(--accent); }
  #map { position: fixed; inset: 0; background: #0b0f0e; } #mapcv { position: absolute; inset: 0; width: 100%; height: 100%; cursor: grab; touch-action: none; } #map.pick #mapcv { cursor: crosshair; }
  #maptop { position: absolute; left: 12px; right: 12px; top: 12px; display: flex; gap: 8px; align-items: center; padding: 8px 12px; flex-wrap: wrap; } #maptop b { letter-spacing: .12em; } #maptop .sp { flex: 1; } #map-info { color: var(--dim); font: 12px var(--mono); }
  #maplegend { position: absolute; right: 12px; bottom: 12px; display: flex; gap: 14px; padding: 8px 12px; font-size: 12px; flex-wrap: wrap; max-width: calc(100vw - 24px); } #maplegend i { display: inline-block; width: 11px; height: 11px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
  /* gunner's primary sight: a round field of view with a simple reticle and the fire-control readouts under it */
  #sight { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(circle at 50% 50%, transparent 0, transparent min(41vh, 41vw), #000 calc(min(41vh, 41vw) + 3px)); color: #ff5a3a; font: 600 15px/1.3 var(--mono); }
  #sight .ring { position: absolute; left: 50%; top: 50%; width: min(82vh, 82vw); height: min(82vh, 82vw); transform: translate(-50%, -50%); border-radius: 50%; box-shadow: inset 0 0 60px 20px rgba(0, 0, 0, .55); }
  #sight .h, #sight .v { position: absolute; left: 50%; top: 50%; background: #ff5a3a; opacity: .9; box-shadow: 0 0 2px #000; } #sight .h { width: min(46vh, 46vw); height: 1.5px; transform: translate(-50%, -50%); -webkit-mask: linear-gradient(90deg, #000 0 44%, transparent 44% 56%, #000 56%); mask: linear-gradient(90deg, #000 0 44%, transparent 44% 56%, #000 56%); }
  #sight .v { width: 1.5px; height: min(30vh, 30vw); transform: translate(-50%, -8%); -webkit-mask: linear-gradient(#000 0 0, transparent 0 12%, #000 12%); mask: linear-gradient(transparent 0 12%, #000 12%); }
  #sight .tick { position: absolute; left: 50%; top: 50%; height: 1.5px; background: #ff5a3a; opacity: .85; box-shadow: 0 0 2px #000; transform: translate(-50%, 0); } #sight .t1 { width: 60px; margin-top: 4vh; } #sight .t2 { width: 44px; margin-top: 8vh; } #sight .t3 { width: 30px; margin-top: 12vh; }
  #sight .data { position: absolute; left: 50%; top: calc(50% - min(32vh, 32vw)); transform: translateX(-50%); text-align: center; white-space: pre; text-shadow: 0 0 6px #000; }
  #sight .sym { position: absolute; left: 50%; top: calc(50% - min(36vh, 36vw)); transform: translateX(-50%); text-shadow: 0 0 6px #000; letter-spacing: .15em; }
  /* enemy sight: the same round picture with the reticle of the weapon the team is using, drawn to true angular size */
  #esight { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(circle at 50% 50%, transparent 0, transparent min(41vh, 41vw), #000 calc(min(41vh, 41vw) + 3px)); color: #f3e9c8; font: 600 14px/1.35 var(--mono); }
  #esight .ring { position: absolute; left: 50%; top: 50%; width: min(82vh, 82vw); height: min(82vh, 82vw); transform: translate(-50%, -50%); border-radius: 50%; box-shadow: inset 0 0 60px 20px rgba(0, 0, 0, .55); }
  #esight svg { position: absolute; left: 50%; top: 50%; width: min(82vh, 82vw); height: min(82vh, 82vw); transform: translate(-50%, -50%); color: #0c0d0b; filter: drop-shadow(0 0 1.2px rgba(255, 255, 255, .55)); font-family: var(--mono); font-weight: 600; overflow: hidden; border-radius: 50%; }
  #esight .data { position: absolute; left: 50%; top: calc(50% - min(32vh, 32vw)); transform: translateX(-50%); text-align: center; white-space: pre; text-shadow: 0 0 6px #000, 0 0 2px #000; }
  #esight .sym { position: absolute; left: 50%; top: calc(50% - min(36vh, 36vw)); transform: translateX(-50%); text-shadow: 0 0 6px #000, 0 0 2px #000; letter-spacing: .12em; white-space: nowrap; }
  #esight.eye { background: none; } #esight.eye .ring, #esight.eye svg { display: none; }
  /* menu of enemy teams for the two enemy views */
  #units { position: fixed; left: 12px; top: 50%; transform: translateY(-50%); width: min(230px, calc(100vw - 24px)); max-height: 60vh; overflow: auto; padding: 8px; z-index: 3; }
  #units h3 { margin: 0 0 6px 2px; font: 11px/1 var(--mono); color: var(--dim); letter-spacing: .1em; text-transform: uppercase; font-weight: 400; }
  #units-list { display: flex; flex-direction: column; gap: 4px; }
  .btn.urow { text-align: left; white-space: normal; padding: 5px 8px; } .urow b { display: block; font-weight: 600; font-size: 13px; } .urow small { display: block; color: var(--dim); font-size: 11px; } .urow:disabled { opacity: .45; cursor: default; }
  #units .keys { margin: 6px 2px 0; color: var(--dim); font-size: 11px; }
  /* what the crew is doing: one line per crewman or weapon */
  #crew { position: fixed; left: 12px; bottom: 14px; width: min(430px, calc(100vw - 24px)); padding: 7px 10px; font: 11.5px/1.45 var(--mono); color: var(--dim); pointer-events: none; z-index: 3; }
  #crew div { padding-left: 44px; text-indent: -44px; } #crew b { color: var(--accent); font-weight: 600; display: inline-block; width: 44px; text-indent: 0; }
  @media (max-width: 1500px) { #crew { bottom: 150px; } }
  /* sensor displays (CITV, HKOI sight): a framed picture with a cross, a box on what is tracked, and readouts */
  #tsight { position: fixed; inset: 0; pointer-events: none; color: #c9ffd2; font: 600 13px/1.35 var(--mono); text-shadow: 0 0 5px #000, 0 0 2px #000; }
  #tsight .frame { position: absolute; inset: 7vh 9vw 20vh 9vw; border: 1px solid rgba(201, 255, 210, .3); box-shadow: 0 0 0 100vmax rgba(0, 0, 0, .55); }
  #tsight .ch, #tsight .cv { position: absolute; left: 50%; top: calc(7vh + (100vh - 27vh) / 2); background: #c9ffd2; opacity: .85; } #tsight .ch { width: 120px; height: 1.5px; transform: translate(-50%, -50%); -webkit-mask: linear-gradient(90deg, #000 0 38%, transparent 38% 62%, #000 62%); mask: linear-gradient(90deg, #000 0 38%, transparent 38% 62%, #000 62%); }
  #tsight .cv { width: 1.5px; height: 120px; transform: translate(-50%, -50%); -webkit-mask: linear-gradient(#000 0 38%, transparent 38% 62%, #000 62%); mask: linear-gradient(#000 0 38%, transparent 38% 62%, #000 62%); }
  #ts-box { position: absolute; left: 0; top: 0; width: 44px; height: 44px; margin: -22px 0 0 -22px; border: 1.5px solid #ffd27a; box-shadow: 0 0 3px #000; }
  #ts-top { position: absolute; left: 50%; top: calc(7vh + 52px); transform: translateX(-50%); white-space: nowrap; letter-spacing: .1em; } #ts-bot { position: absolute; left: 50%; top: calc(7vh + 76px); transform: translateX(-50%); white-space: pre; text-align: center; }
  /* driver: three vision blocks */
  #dsight { position: fixed; inset: 0; pointer-events: none; color: #e6efe9; font: 600 13px var(--mono); } #dsight svg { position: absolute; inset: 0; width: 100%; height: 100%; } #ds-text { position: absolute; left: 50%; top: 61vh; transform: translateX(-50%); text-shadow: 0 0 5px #000; letter-spacing: .1em; }
  /* replay: a time bar with a mark at every event */
  body:has(#replay:not([hidden])) #crew { bottom: 250px; }   /* the crew panel moves up out of the replay bar's way */
  #replay { position: fixed; left: 50%; bottom: 136px; transform: translateX(-50%); width: min(900px, calc(100vw - 24px)); padding: 8px 10px; z-index: 3; box-sizing: border-box; }
  .rp-row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font: 12px var(--mono); } .rp-row b { letter-spacing: .12em; color: var(--warn); margin-right: 4px; } .rp-row .sp { flex: 1; } #rp-time { color: var(--fg); margin-left: 6px; } #rp-what { color: var(--dim); margin-left: 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 46%; }
  .rp-track { position: relative; margin-top: 6px; height: 22px; } #rp-bar { position: absolute; left: 0; right: 0; top: 2px; width: 100%; margin: 0; accent-color: var(--accent); }
  #rp-ticks { position: absolute; left: 8px; right: 8px; top: 0; height: 22px; pointer-events: none; } #rp-ticks i { position: absolute; top: 0; width: 2px; height: 6px; background: var(--warn); } #rp-ticks i.k { background: var(--accent); height: 8px; } #rp-ticks i.h { background: var(--bad); height: 10px; }
  #status, #log, #bar, #caption, #hud, #errbar { z-index: 3; }
  #veil { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #060908; font: 14px var(--mono); color: var(--dim); letter-spacing: .1em; }
  [hidden] { display: none !important; }
</style>
<script type="importmap">{ "imports": { "three": "{{THREE}}/build/three.module.js", "three/addons/": "{{THREE}}/examples/jsm/" } }</script>
</head>
<body>
<canvas id="view"></canvas>
<div id="marks"></div>
<div id="hud" class="panel" hidden></div>
<div id="status" hidden></div>
<div id="log" class="panel" hidden></div>
<div id="caption"></div>
<div id="bar" class="panel" hidden></div>

<div id="title" class="screen" hidden>
  <div class="card panel">
    <h1>HKOI <em>BATTLEFIELD</em></h1>
    <div class="sub">Overtake-and-Bloom mission simulator · beta build <span id="ver"></span></div>
    <div class="opts">
      <div class="opt"><label>World</label><div class="seg" id="o-biome"></div></div>
      <div class="opt"><label>Conditions</label><div class="seg" id="o-cond"></div></div>
      <div class="opt"><label>Enemy force</label><div class="seg" id="o-force"></div></div>
      <div class="opt"><label>Mission</label><div class="seg" id="o-mission"></div></div>
      <div class="opt"><label>Battle length</label><div class="seg" id="o-waves"></div></div>
      <div class="opt"><label>Enemy crews</label><div class="seg" id="o-skill"></div></div>
      <div class="opt"><label>Map number</label><div class="seg"><input type="number" id="o-map" min="1" max="9999" value="3"><button class="btn" id="o-rand">Random</button></div></div>
      <div class="opt"><label>View</label><div class="seg" id="o-spec"></div></div>
      <div class="opt"><label>Graphics</label><div class="seg" id="o-gfx"></div></div>
    </div>
    <div class="row" style="margin-top:12px"><input id="o-code" placeholder="Paste a replay code here" style="flex:1;min-width:200px;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:11px var(--mono)" aria-label="Replay code"><button class="btn" id="o-codebtn">Watch that replay</button></div>
    <div class="row"><button class="btn primary" id="go">Start battle</button><button class="btn" id="o-mapbtn" style="padding:10px 16px">Map and position</button><div class="note" id="o-note"></div></div>
  </div>
</div>
<div id="result" class="screen" hidden><div class="card panel"><h1 id="r-head"></h1><div class="sub" id="r-sub"></div><table id="r-table"></table><div class="row"><button class="btn primary" id="r-replay">Watch the replay</button><button class="btn" id="r-again">Same battle again</button><button class="btn" id="r-next">New enemy, same ground</button><button class="btn" id="r-menu">Main menu</button></div><div class="row" style="margin-top:10px"><button class="btn" id="r-code">Copy replay code</button><input id="r-codebox" readonly style="flex:1;min-width:180px;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:11px var(--mono)" aria-label="Replay code"></div></div></div>
<div id="map" hidden>
  <canvas id="mapcv"></canvas>
  <div id="maptop" class="panel"><b id="map-title">MAP</b><span id="map-info"></span><span class="sp"></span><button class="btn" id="map-place">Place vehicle</button><button class="btn" id="map-reset">Default position</button><button class="btn" id="map-fit">Whole map</button><button class="btn primary" id="map-close" style="padding:6px 16px;font-size:13px">Close</button></div>
  <div id="maplegend" class="panel"><span><i style="background:#39d98a"></i>Vehicle</span><span><i style="background:rgba(215,40,30,.5)"></i>Ground that can see the vehicle</span><span><i style="background:#ff5a4d"></i>Enemy located</span><span><i style="background:#a8c896"></i>Woods</span><span><i style="background:#96673f"></i>Contours</span></div>
</div>
<div id="sight" hidden>
  <div class="ring"></div><div class="h"></div><div class="v"></div><div class="tick t1"></div><div class="tick t2"></div><div class="tick t3"></div>
  <div class="data" id="sight-data"></div><div class="sym" id="sight-sym"></div>
</div>
<div id="esight" hidden>
  <div class="ring"></div><svg id="esight-ret" viewBox="-500 -500 1000 1000" aria-hidden="true"></svg>
  <div class="sym" id="esight-sym"></div><div class="data" id="esight-data"></div>
</div>
<div id="units" class="panel" hidden><h3>Enemy teams</h3><div id="units-list"></div><div class="keys">Keys [ and ] step through the teams</div></div>
<div id="tsight" hidden><div class="frame"></div><div class="ch"></div><div class="cv"></div><div id="ts-box" hidden></div><div id="ts-top"></div><div id="ts-bot"></div></div>
<div id="dsight" hidden><svg viewBox="0 0 1600 900" preserveAspectRatio="none" aria-hidden="true"><path fill="#050706" fill-rule="evenodd" d="M0 0H1600V900H0Z M90 250H500Q520 250 520 270V500Q520 520 500 520H90Q70 520 70 500V270Q70 250 90 250Z M600 235H1000Q1020 235 1020 255V505Q1020 525 1000 525H600Q580 525 580 505V255Q580 235 600 235Z M1100 250H1510Q1530 250 1530 270V500Q1530 520 1510 520H1100Q1080 520 1080 500V270Q1080 250 1100 250Z"/></svg><div id="ds-text"></div></div>
<div id="crew" class="panel" hidden></div>
<div id="replay" class="panel" hidden>
  <div class="rp-row"><b>REPLAY</b><button class="btn" id="rp-start" title="Back to the start">|◀</button><button class="btn" id="rp-prev" title="Previous event">◀ event</button><button class="btn" id="rp-play">Pause</button><button class="btn" id="rp-next" title="Next event">event ▶</button><span id="rp-time"></span><span id="rp-what"></span><span class="sp"></span><button class="btn" id="rp-result">Result</button></div>
  <div class="rp-track"><div id="rp-ticks"></div><input type="range" id="rp-bar" min="0" max="1000" value="0" step="1" aria-label="Replay time"></div>
</div>
<div id="errbar" hidden style="position:fixed;left:12px;right:12px;bottom:150px;background:rgba(60,8,4,.94);border:1px solid #ff5a4d;color:#ffd9d4;border-radius:8px;padding:10px 12px;font:12px/1.4 ui-monospace,Menlo,monospace;user-select:text"></div>
<div id="veil">LOADING BATTLEFIELD…</div>

<script>
  /* if anything fails to load, say so on screen instead of sitting on "Loading" */
  (function () { var veil = document.getElementById('veil'), errs = []; function show(m) { errs.push(String(m).slice(0, 240)); veil.hidden = false; veil.style.color = '#ff7a6d'; veil.style.whiteSpace = 'pre-wrap'; veil.style.padding = '24px'; veil.textContent = 'Could not start the battlefield:\n' + errs.slice(0, 4).join('\n'); }
    window.__showErr = show;
    window.addEventListener('error', function (e) { if (window.__beta && window.__beta.ready) { console.error(e.message); return; } show(e.message || (e.target && (e.target.src || e.target.href) ? 'failed to load ' + (e.target.src || e.target.href) : 'error')); }, true);
    window.addEventListener('unhandledrejection', function (e) { if (window.__beta && window.__beta.ready) return; show(e.reason && e.reason.message || e.reason); });
    setTimeout(function () { if (!window.__beta && !errs.length) show('still loading after 25 s: the 3D library may be blocked on this network'); }, 25000); })();
</script>
<script src="engine.js"></script><script>window.HK = window.HK || (typeof HK !== 'undefined' ? HK : null);</script>
<script src="dmg.js"></script><script src="campaign.js"></script>
<script src="world/world.js"></script><script src="battle/tankai.js"></script><script src="battle/battle.js"></script>
<script type="module" src="app/main.js"></script>
</body>
</html>
